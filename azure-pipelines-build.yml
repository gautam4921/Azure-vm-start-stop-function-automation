trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.11'
  azureServiceConnection: 'sc-azure-vm-automation'
  functionResourceGroup: 'rg-vm-automation'
  functionAppName: 'func-vm-auto-i3mo0bv'

stages:
- stage: Build_Test
  displayName: Build and test Python Function
  jobs:
  - job: Build
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r function-app/requirements.txt
        pip install pytest
        PYTHONPATH=function-app pytest -q tests
      displayName: Install dependencies and run unit tests

    - task: ArchiveFiles@2
      displayName: Package Function App source
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)/function-app'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/functionapp.zip'
        replaceExistingArchive: true

    - publish: '$(Build.ArtifactStagingDirectory)/functionapp.zip'
      artifact: function-package

- stage: Deploy_Dev
  displayName: Deploy to Development Flex Consumption
  dependsOn: Build_Test
  condition: succeeded()
  jobs:
  - deployment: DeployFunction
    environment: vm-automation-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: function-package

          - task: AzureCLI@2
            displayName: Deploy Flex Consumption package with remote Python build
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                az functionapp deployment source config-zip `
                  --resource-group "$(functionResourceGroup)" `
                  --name "$(functionAppName)" `
                  --src "$(Pipeline.Workspace)/function-package/functionapp.zip" `
                  --build-remote true
