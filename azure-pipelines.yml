
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.11'

  # Azure DevOps service connection
  azureServiceConnection: 'sc-azure-vm-automation'

  # Azure resources
  functionResourceGroup: 'rg-vm-automation'
  functionAppName: 'func-vm-auto-i3mo0bv'
  
  # Change the Azure Function App name after terraform deployment
  

  # Azure Artifacts feed
  artifactFeed: 'Azure-vm-start-stop-automation/python-packages'

  # Project paths
  functionProjectPath: '$(Build.SourcesDirectory)/function-app'
  testProjectPath: '$(Build.SourcesDirectory)/tests'

  # Build artifact
  artifactName: 'function-package'
  zipFileName: 'functionapp.zip'


stages:

# ==========================================================
# STAGE 1: BUILD AND TEST
# ==========================================================

- stage: Build_Test
  displayName: 'Build and Test Azure Function'

  jobs:
  - job: Build
    displayName: 'Install dependencies, test and package'

    steps:

    # 1. Checkout GitHub repository
    - checkout: self
      clean: true

    # 2. Select Python 3.11
    - task: UsePythonVersion@0
      displayName: 'Select Python 3.11'
      inputs:
        versionSpec: '$(pythonVersion)'
        addToPath: true

    # 3. Verify source code structure
    - script: |
        set -euo pipefail

        echo "Checking repository structure..."

        echo "Function App files:"
        ls -la "$(functionProjectPath)"

        echo "Test files:"
        ls -la "$(testProjectPath)"

        test -f "$(functionProjectPath)/host.json"
        test -f "$(functionProjectPath)/function_app.py"
        test -f "$(functionProjectPath)/requirements.txt"
        test -d "$(testProjectPath)"

      displayName: 'Verify Function App source files'

    # 4. Authenticate with Azure Artifacts
    - task: PipAuthenticate@1
      displayName: 'Authenticate Azure Artifacts Python Feed'
      inputs:
        artifactFeeds: '$(artifactFeed)'
        onlyAddExtraIndex: false

    # 5. Install dependencies and execute unit tests
    - script: |
        set -euo pipefail

        echo "Python version:"
        python --version

        echo "Pip version:"
        python -m pip --version

        echo "Installing Function App dependencies from Azure Artifacts..."

        python -m pip install \
          --disable-pip-version-check \
          --retries 10 \
          --timeout 120 \
          -r "$(functionProjectPath)/requirements.txt" \
          pytest

        echo "Installed Python packages:"
        python -m pip list

        echo "Running unit tests..."

        PYTHONPATH="$(functionProjectPath)" \
          python -m pytest -v "$(testProjectPath)/"

      displayName: 'Install dependencies and run unit tests'
      env:
        PIP_DEFAULT_TIMEOUT: '120'
        PIP_RETRIES: '10'

    # 6. Create Function App deployment ZIP
    - task: ArchiveFiles@2
      displayName: 'Create Function App ZIP package'
      inputs:
        rootFolderOrFile: '$(functionProjectPath)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(zipFileName)'
        replaceExistingArchive: true

    # 7. Verify ZIP package
    - script: |
        set -euo pipefail

        echo "Deployment ZIP package:"
        ls -lh "$(Build.ArtifactStagingDirectory)/$(zipFileName)"

        echo "ZIP contents:"
        unzip -l "$(Build.ArtifactStagingDirectory)/$(zipFileName)"

      displayName: 'Verify deployment package'

    # 8. Publish pipeline artifact
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Function App artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/$(zipFileName)'
        artifact: '$(artifactName)'
        publishLocation: 'pipeline'


# ==========================================================
# STAGE 2: DEPLOY TO DEVELOPMENT
# ==========================================================

- stage: Deploy_Dev
  displayName: 'Deploy Azure Function to DEV'

  dependsOn: Build_Test
  condition: succeeded()

  jobs:
  - deployment: DeployFunction
    displayName: 'Deploy Python Function App'

    environment: 'vm-automation-dev'

    strategy:
      runOnce:
        deploy:
          steps:

          # 1. Download build artifact
          - download: current
            artifact: '$(artifactName)'

          # 2. Verify downloaded ZIP
          - script: |
              set -euo pipefail

              echo "Checking downloaded artifact..."

              ls -lh "$(Pipeline.Workspace)/$(artifactName)/$(zipFileName)"

            displayName: 'Verify downloaded artifact'

          # 3. Deploy Function App to Azure
          - task: AzureCLI@2
            displayName: 'Deploy Function App to Azure'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail

                echo "Connected Azure account:"
                az account show --output table

                echo "Starting Function App deployment..."

                az functionapp deployment source config-zip \
                  --resource-group "$(functionResourceGroup)" \
                  --name "$(functionAppName)" \
                  --src "$(Pipeline.Workspace)/$(artifactName)/$(zipFileName)" \
                  --build-remote true

                echo "Function App deployment command completed."

          # 4. Verify Function App
          - task: AzureCLI@2
            displayName: 'Verify Function App deployment'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail

                echo "Checking Function App details..."

                az functionapp show \
                  --resource-group "$(functionResourceGroup)" \
                  --name "$(functionAppName)" \
                  --query "{name:name,state:state,hostName:defaultHostName}" \
                  --output table

                echo "Deployment verification completed."
